name: child_life
description: "Child Life — cùng chăm con, giữ tuổi thơ."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_crashlytics: ^5.4.0
  firebase_performance: ^0.11.6
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  package_info_plus: ^10.2.2
  uuid: ^4.6.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  android_intent_plus: ^6.1.0
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  mobile_scanner: ^7.4.2
  connectivity_plus: ^7.2.0
  flutter_local_notifications: ^22.3.1
  device_info_plus: ">=13.2.0 <13.3.0"
  firebase_storage: ^13.6.0
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  # No longer used by app code (the viewer plays with media_kit); held at the version the
  # wechat_assets_picker preview resolves to.
  video_player: ">=2.14.0 <2.14.1"
  fc_native_video_thumbnail: ^3.0.1
  gal: ^2.3.3
  file_picker: ^13.1.0
  firebase_messaging: ^16.7.0
  # 10g library picker with native drag to select (since 9.5, global in 10.1).
  wechat_assets_picker: ^10.1.3
  # 10f video playback (libmpv); MediaKit.ensureInitialized() in bootstrap.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  play_install_referrer: ^0.5.0
  wakelock_plus: ^1.8.0
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  csv: ^6.0.0
  archive: ^4.0.7
  xml: ^7.0.1
  in_app_review: ^2.0.12
  webview_flutter: ^4.14.1
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
    # Milestone cards only (D-068; MM10 / MM11 titles are Bold): its own family so the app's
    # existing w700 text keeps rendering as before. SIL OFL 1.1 (assets/fonts/OFL.txt).
    - family: Be Vietnam Pro Keepsake
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    # Story reader and cards (S13, 14g / 14i). SIL OFL 1.1 (assets/fonts/OFL-*.txt).
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: Dancing Script
      fonts:
        - asset: assets/fonts/DancingScript-Regular.ttf
          weight: 400
        - asset: assets/fonts/DancingScript-SemiBold.ttf
          weight: 600
    # Milestone cards, Chapter 01 set (E-1; docs/product/remember-2-templates.md). SIL OFL 1.1
    # (assets/fonts/OFL-playfairdisplay.txt, OFL-baloo2.txt, OFL-patrickhand.txt).
    - family: Playfair Display Keepsake
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Baloo 2 Keepsake
      fonts:
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Patrick Hand Keepsake
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
          weight: 400

  assets:
    - assets/icons/
    - assets/logo/
    - assets/brands/
    - assets/illustrations/
    - assets/sounds/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
