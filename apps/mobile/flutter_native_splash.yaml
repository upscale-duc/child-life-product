# Native launch screens (Figma 00 Splash 36:2233: "static launch screen = this layout without the glow").
# Regenerate with: dart run flutter_native_splash:create
# Night care uses the logo night palette and follows the system appearance.
flutter_native_splash:
  color: "#F6FCFB"
  image: branding/splash/mark-color.png
  color_dark: "#0C1719"
  image_dark: branding/splash/mark-night.png
  android_12:
    color: "#F6FCFB"
    image: branding/splash/android12-color.png
    color_dark: "#0C1719"
    image_dark: branding/splash/android12-night.png
  ios_content_mode: center
  web: false
