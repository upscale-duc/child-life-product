<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiệp và video · Trình chỉnh sửa</title><style>body{font:16px system-ui;background:#eef5f4;color:#173f43;margin:24px}header{max-width:1050px}label{display:inline-block;margin:8px}select{font:inherit;padding:8px}main{display:flex;gap:24px;flex-wrap:wrap}figure{margin:12px 0}figcaption{font-weight:600;margin-bottom:12px}img{width:min(100%,375px);border:1px solid #9bbaba;border-radius:12px;display:block}p{max-width:950px}a{color:#006d68}</style><header><h1>Trình chỉnh sửa thiệp và video</h1><p>Bản mới chia theo Thông tin · Lời nhắn · Ảnh & nhạc. Ảnh Flutter thật với dữ liệu kiểm thử; ảnh mẫu là màu phẳng. Bàn phím được giả lập bằng khoảng trống 300 px.</p><label>Loại <select id="kind"><option value="video">Video</option><option value="card">Thiệp</option></select></label><label>Ngôn ngữ <select id="lang"><option>vi</option><option>en</option></select></label><label>Giao diện <select id="theme"><option value="light">Light</option><option value="nightCare">Night care</option></select></label><label>Cỡ chữ <select id="scale"><option value="1.0">100%</option><option value="2.0">200%</option></select></label><label>Mục <select id="state"><option value="details">Thông tin</option><option value="optional">Thêm chi tiết</option><option value="wording">Lời nhắn</option><option value="media">Ảnh & nhạc</option><option value="crop">Căn ảnh (video)</option><option value="settings">Tuỳ chỉnh</option><option value="keyboard">Bàn phím</option></select></label></header><main><figure><figcaption>Trước</figcaption><a id="oldLink"><img id="old"></a></figure><figure><figcaption>A · Biểu mẫu thu gọn (không chọn)</figcaption><a id="aLink"><img id="a"></a></figure><figure><figcaption>Sau · Chia theo mục (đã triển khai)</figcaption><a id="newLink"><img id="new"></a></figure></main><script>const ids=['kind','lang','theme','scale','state'];function update(){const [k,l,t,z,s]=ids.map(id=>document.getElementById(id).value);const suffix=`${t}_${l}_${z}x.png`;const state=k==='card'&&s==='crop'?'media':s;for(const [id,path] of [['old',`before/premium_${k}_${suffix}`],['a',`A/premium_${k}_${suffix}`],['new',`after/${k}_${state}_${suffix}`]]){document.getElementById(id).src=path;document.getElementById(id+'Link').href=path}}ids.forEach(id=>document.getElementById(id).addEventListener('change',update));update();</script></html>
