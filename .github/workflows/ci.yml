name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2 # dart format is used by the token generator check
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @child-life/contracts --filter @child-life/web-config run build
      - name: Design tokens are up to date (Dart + CSS generated from tokens.json)
        run: pnpm --filter @child-life/design-tokens run check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Firestore & Storage rules tests (emulators)
        run: |
          npm install --global firebase-tools@15.33.0
          pnpm test:rules
      - name: Build Functions bundle and web apps (dev)
        run: |
          pnpm --filter child-life-functions run build:deploy
          pnpm --filter child-life-landing --filter child-life-portal run build:dev

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ../../.flutter-version
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - run: flutter build apk --flavor dev --debug

  # A2 (docs/product/android-plan.md): on main, a dev build signed with the upload key, kept as an
  # artifact and sent to the "dev-testers" group in Firebase App Distribution. It does nothing
  # until the owner adds the secrets: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD,
  # ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD, and FIREBASE_DEV_DISTRIBUTION_SA (a
  # child-life-dev service account with the Firebase App Distribution Admin role). An APK, not a
  # bundle: App Distribution takes bundles only for apps linked to Google Play, which the dev app is not.
  android-dev-release:
    if: github.event_name == 'push'
    needs: mobile
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      DISTRIBUTION_SA: ${{ secrets.FIREBASE_DEV_DISTRIBUTION_SA }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Upload key present?
        id: key
        run: echo "present=$([ -n "$UPLOAD_KEYSTORE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.present == 'true'
        with:
          flutter-version-file: ../../.flutter-version
          channel: stable
          cache: true
      - name: Build the signed dev APK
        if: steps.key.outputs.present == 'true'
        env:
          CL_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          CL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          CL_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks" flutter build apk --flavor dev --release --build-number "$GITHUB_RUN_NUMBER"
          rm "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: child-life-dev-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-dev-release.apk
          retention-days: 14
      - name: Send to dev testers (Firebase App Distribution)
        if: steps.key.outputs.present == 'true' && env.DISTRIBUTION_SA != ''
        run: |
          echo "$DISTRIBUTION_SA" > "$RUNNER_TEMP/distribution.json"
          APP_ID=$(jq -r '.client[] | select(.client_info.android_client_info.package_name == "app.childlife.dev") | .client_info.mobilesdk_app_id' android/app/src/dev/google-services.json)
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/distribution.json" npx --yes firebase-tools@15.33.0 \
            appdistribution:distribute build/app/outputs/flutter-apk/app-dev-release.apk \
            --app "$APP_ID" --groups dev-testers --release-notes "main ${GITHUB_SHA::8}"
          rm "$RUNNER_TEMP/distribution.json"

  mobile-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ../../.flutter-version
          channel: stable
          cache: true
      - run: flutter test --tags golden # goldens are generated on macOS
      - run: flutter build ios --flavor dev --simulator --debug

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
